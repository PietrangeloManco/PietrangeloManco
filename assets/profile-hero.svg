<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Pietrangelo Manco — AI systems and full-stack products</title>
  <desc id="description">A navy and blue portfolio banner with three focus areas: applied AI, product engineering, and production systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a33"/>
      <stop offset="0.55" stop-color="#123a68"/>
      <stop offset="1" stop-color="#2563a9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="32" fill="url(#background)"/>
  <circle cx="1040" cy="-20" r="230" fill="#60a5fa" opacity="0.13"/>
  <circle cx="1130" cy="250" r="170" fill="#22d3ee" opacity="0.10" filter="url(#soft)"/>
  <path d="M900 64h176M900 96h112M930 128h198" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  <circle cx="878" cy="64" r="6" fill="#67e8f9"/>
  <circle cx="878" cy="96" r="6" fill="#93c5fd"/>
  <circle cx="908" cy="128" r="6" fill="#bfdbfe"/>

  <text x="72" y="104" fill="#dbeafe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">AI / ML · FULL-STACK · DELIVERY</text>
  <text x="72" y="174" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="750">Pietrangelo Manco</text>
  <rect x="72" y="198" width="420" height="5" rx="2.5" fill="url(#accent)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="72" y="238" width="178" height="46" rx="23" fill="#ffffff" opacity="0.10" stroke="#93c5fd" stroke-opacity="0.42"/>
    <text x="101" y="268" fill="#e0f2fe">Applied AI</text>
    <rect x="266" y="238" width="228" height="46" rx="23" fill="#ffffff" opacity="0.10" stroke="#93c5fd" stroke-opacity="0.42"/>
    <text x="295" y="268" fill="#e0f2fe">Product engineering</text>
    <rect x="510" y="238" width="222" height="46" rx="23" fill="#ffffff" opacity="0.10" stroke="#93c5fd" stroke-opacity="0.42"/>
    <text x="539" y="268" fill="#e0f2fe">Production systems</text>
  </g>
</svg>
